<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>YouTube 頻道 1</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; height:100vh; overflow:hidden; }
#yt-player { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }
.placeholder {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100vh; background:#04080f; color:rgba(255,255,255,0.2);
  font-family:'Microsoft JhengHei',sans-serif; gap:16px;
}
.placeholder .icon { font-size:80px; }
.placeholder .msg  { font-size:22px; letter-spacing:2px; }
.placeholder .sub  { font-size:14px; opacity:0.5; }
</style>
<script src="../../shared/kioskGuard.js"></script>
</head>
<body>
<div id="wrap" style="width:100%;height:100%;position:relative;">
  <div class="placeholder">
    <div class="icon">📺</div>
    <div class="msg">載入中…</div>
  </div>
</div>

<script src="../../shared/api.js"></script>
<script>
'use strict';
var player = null;
var currentId = '';

function onYouTubeIframeAPIReady() {
  if (currentId) loadPlayer(currentId);
}

var errTimer = null;

/* 載入 YouTube iframe API；30 秒內沒載入（斷網或被擋）就重新插入腳本再試。
   不用整頁重載：斷網時重載會停在瀏覽器錯誤頁，之後就沒有程式能再恢復 */
function loadYtApi() {
  if (window.YT && YT.Player) return;
  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = function() { tag.remove(); };
  document.head.appendChild(tag);
  setTimeout(function() {
    if (window.YT && YT.Player) return;
    tag.remove();
    loadYtApi();
  }, 30000);
}

function loadPlayer(id) {
  var wrap = document.getElementById('wrap');
  clearTimeout(errTimer);
  // 重建前先銷毀舊 player，避免殘留 iframe 與事件
  if (player) { try { player.destroy(); } catch (x) {} player = null; }
  wrap.innerHTML = '<div id="yt-player"></div>';
  player = new YT.Player('yt-player', {
    videoId: id,
    width: '100%',
    height: '100%',
    playerVars: {
      autoplay: 1,
      mute: 1,
      rel: 0,
      showinfo: 0,
      controls: 0,
      vq: 'hd1080'
    },
    events: {
      onReady: function(e) {
        e.target.setPlaybackQuality('hd1080');
        if (e.target.setPlaybackQualityRange) e.target.setPlaybackQualityRange('hd1080', 'highres');
        e.target.playVideo();
      },
      onPlaybackQualityChange: function(e) {
        var q = e.target.getPlaybackQuality();
        if (q !== 'hd1080' && q !== 'hd2160' && q !== 'highres') {
          e.target.setPlaybackQuality('hd1080');
        }
      },
      onError: function() {
        // 影片不可用或網路錯誤：60 秒後重建播放器（直播中斷、暫時性錯誤多半會自行恢復）
        clearTimeout(errTimer);
        errTimer = setTimeout(function() { if (currentId) loadPlayer(currentId); }, 60000);
      },
      onStateChange: function(e) {
        if (e.data === YT.PlayerState.PLAYING) {
          var q = e.target.getPlaybackQuality();
          if (q !== 'hd1080' && q !== 'hd2160' && q !== 'highres') {
            e.target.setPlaybackQuality('hd1080');
            if (e.target.setPlaybackQualityRange) e.target.setPlaybackQualityRange('hd1080', 'highres');
          }
        }
      }
    }
  });
}

function render(id) {
  currentId = id || '';
  var wrap = document.getElementById('wrap');
  if (!id) {
    if (player) { player.destroy(); player = null; }
    wrap.innerHTML = '<div class="placeholder"><div class="icon">📺</div><div class="msg">YouTube 頻道 1</div><div class="sub">請至管理後台設定 YouTube ID</div></div>';
    return;
  }
  if (window.YT && YT.Player) {
    loadPlayer(id);
  }
  // 若 API 尚未載入，等 onYouTubeIframeAPIReady 觸發
}

async function init() {
  if (window.ghBackup) await window.ghBackup.autoRestore();
  var s = await window.api.get('settings');
  currentId = s.youtubeId || '';
  // 載入 YouTube IFrame API
  loadYtApi();
  // 若 API 已載入過（重新整理後快取）
  if (window.YT && YT.Player && currentId) loadPlayer(currentId);
}

window.api.on('settings:updated', function(s) { render(s.youtubeId || ''); });
init();
</script>
</body>
</html>
