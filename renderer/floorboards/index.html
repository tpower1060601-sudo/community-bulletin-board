<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>樓層告示牌（合併）</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; }
#stage { position:absolute; top:0; left:0; width:2160px; height:1920px; transform-origin:0 0; }
.fb-frame { position:absolute; top:0; border:0; width:1080px; height:1920px; background:#050505; }
#fbA { left:0px; }
#fbB { left:1080px; }
</style>
</head>
<body>
<div id="stage">
  <iframe id="fbA" class="fb-frame" src="../screen10/"></iframe>
  <iframe id="fbB" class="fb-frame" src="../screen11/"></iframe>
</div>

<script>
'use strict';
/* 寬高各自撐滿實際可視區域，不留白（做法沿用 renderer/wall/index.html 已驗證過的方式） */
(function autoScale() {
  var W = 2160, H = 1920;
  var stage = document.getElementById('stage');
  function fit() {
    var sx = window.innerWidth / W;
    var sy = window.innerHeight / H;
    stage.style.transform = 'scale(' + sx + ',' + sy + ')';
  }
  fit();
  window.addEventListener('resize', fit);
  // kiosk 視窗開啟後，OS 需要一點時間才會把 --window-position/--window-size
  // 真正套用到最終位置，太早讀到的 window.innerWidth/innerHeight 可能不準，
  // 補幾次延遲重新校正，避免縮放比例鎖死在錯誤的暫時尺寸上。
  [300, 1000, 3000].forEach(function(delay) { setTimeout(fit, delay); });
})();
</script>
</body>
</html>
