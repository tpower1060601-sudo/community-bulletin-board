<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>梯間公告</title>
<!-- 相容性：PSN 播放器只能用 Win7 的 Chrome（最高 109），整頁刻意寫成 ES5＋舊版 CSS：
     不用 grid／inset／flex gap／CSS 變數／箭頭函式／樣板字串／async／fetch。
     CSS zoom 在 Chrome 128 前後算法不同，所以縮放框一律由 JS 給固定像素尺寸（fitAll）。 -->
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  background: #0a0e1a;
  color: #fff;
  font-family: 'Microsoft JhengHei','PingFang TC',sans-serif;
  overflow: hidden;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-user-select: none; user-select: none;
}
.fill { position:absolute; top:0; left:0; right:0; bottom:0; }
.col {
  position: relative;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  min-width: 0; min-height: 0; overflow: hidden;
}
/* 左 1/3 公告、右 2/3 財經 */
.col-ann  { width:33.3333%; -webkit-flex-shrink:0; flex-shrink:0; border-right:2px solid rgba(245,158,11,.35); background:#0c0b09; }
.col-main { -webkit-flex:1; flex:1; }

/* ── 標題列（只有右欄有；左欄公告不放標題，讓出空間） ── */
.header {
  -webkit-flex-shrink:0; flex-shrink:0;
  height: 68px;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: space-between; justify-content: space-between;
  padding: 0 28px;
  background: rgba(0,0,0,0.5);
  border-bottom: 2px solid #f59e0b;
}
.header-left, .header-right { display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; }
.header-icon { font-size:30px; line-height:1; margin-right:16px; }
.header-title {
  font-size: 26px; font-weight: 900; letter-spacing: 3px;
  color: #f59e0b;
  text-shadow: 0 0 16px rgba(245,158,11,0.5);
  white-space: nowrap;
}
.header-subtitle { font-size:13px; color:rgba(255,255,255,0.4); letter-spacing:2px; margin-top:2px; white-space:nowrap; }
.header-right > * { margin-left:18px; }
.mkt-badge {
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  padding: 5px 14px; border-radius: 18px;
  font-size: 15px; font-weight: 700; letter-spacing: 1px; white-space: nowrap;
  background: rgba(245,158,11,0.10);
  border: 1px solid rgba(245,158,11,0.3);
  color: #f59e0b;
}
.badge-dot {
  width: 8px; height: 8px; border-radius: 50%; margin-right:8px;
  background: #22c55e; box-shadow: 0 0 6px #22c55e;
  -webkit-animation: pulse 1.5s ease-in-out infinite; animation: pulse 1.5s ease-in-out infinite;
}
.badge-dot.closed { background:#64748b; box-shadow:none; -webkit-animation:none; animation:none; }
@-webkit-keyframes pulse { 0%,100%{opacity:1;-webkit-transform:scale(1)} 50%{opacity:.5;-webkit-transform:scale(.8)} }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }
.date { font-size:16px; color:rgba(255,255,255,.55); letter-spacing:1px; white-space:nowrap; }
.clock {
  font-size: 26px; font-weight: 900;
  color: #f59e0b;
  text-shadow: 0 0 14px rgba(245,158,11,0.4);
  letter-spacing: 2px;
}

/* ══ 左欄：直立公告（同 screen13 的像素單位，用 transform 等比縮小） ══ */
.ann-wrap { -webkit-flex:1; flex:1; min-height:0; position:relative; overflow:hidden; }
/* 舞台以 screen13 單位（寬 1600）撰寫，JS 設定舞台的像素寬高並 scale 回欄寬；
   後台內容裡的行內字級也會一起縮，不會撐爆窄欄 */
.ann-stage { position:absolute; top:0; left:0; overflow:hidden; -webkit-transform-origin:0 0; transform-origin:0 0; }
.slide {
  position: absolute; top:0; left:0; right:0; bottom:0;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  padding: 60px 80px;
  opacity: 0; z-index: 0;
  background: radial-gradient(ellipse at center, rgba(0,40,80,.5) 0%, transparent 70%);
  -webkit-transition: opacity 0.7s ease; transition: opacity 0.7s ease;
}
.slide.active { opacity:1; z-index:1; }
.slide.slide-in {
  z-index:2; opacity:1;
  -webkit-animation: annSlideUp 1.1s cubic-bezier(0.25,0.46,0.45,0.94) both;
  animation: annSlideUp 1.1s cubic-bezier(0.25,0.46,0.45,0.94) both;
}
@-webkit-keyframes annSlideUp { from{-webkit-transform:translateY(100%)} to{-webkit-transform:translateY(0%)} }
@keyframes annSlideUp { from{transform:translateY(100%)} to{transform:translateY(0%)} }
.slide-inner { max-width:1720px; text-align:left; width:100%; }
.slide-with-img {
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  -webkit-align-items: center; align-items: center;
  text-align:left; width:100%; max-width:1720px;
}
.slide-img-top {
  -webkit-flex-shrink:0; flex-shrink:0; width:100%; max-height:900px; margin-bottom:60px;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
}
.slide-img-top img { max-width:100%; max-height:900px; border-radius:28px; object-fit:contain; box-shadow:0 16px 64px rgba(0,0,0,0.6); }
.slide-text-block { width:100%; }
.slide-fullimg {
  position:absolute; top:0; left:0; right:0; bottom:0; z-index:5; background:#000;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
}
.slide-fullimg img { width:100%; height:100%; object-fit:contain; }
.slide-badge { display:inline-block; padding:16px 40px; border-radius:60px; font-size:44px; font-weight:700; letter-spacing:3px; margin-bottom:48px; border:1px solid; }
.badge-general{ color:#f0a500; border-color:rgba(240,165,0,.4); background:rgba(240,165,0,.1); }
.badge-urgent { color:#ff4d4d; border-color:rgba(255,77,77,.4);  background:rgba(255,77,77,.1); }
.badge-event  { color:#2ecc71; border-color:rgba(46,204,113,.4); background:rgba(46,204,113,.1); }
.badge-notice { color:#f59e0b; border-color:rgba(0,212,255,.4); background:rgba(0,212,255,.1); }
.slide-title { font-size:120px; font-weight:900; line-height:1.35; margin-bottom:48px; color:#fff; text-shadow:0 0 60px rgba(0,212,255,.3); }
.slide-with-img .slide-title { font-size:96px; }
.slide-body { font-size:72px; line-height:2.0; color:rgba(255,255,255,.8); }
.slide-with-img .slide-body { font-size:60px; }
.slide-date { margin-top:56px; font-size:40px; color:rgba(255,255,255,.35); }
.ann-empty {
  position:absolute; top:0; left:0; right:0; bottom:0;
  color:rgba(255,255,255,.2); font-size:110px; text-align:center;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
}

.dots {
  -webkit-flex-shrink:0; flex-shrink:0; min-height:30px; padding:10px 12px;
  display: -webkit-flex; display: flex;
  -webkit-flex-wrap: wrap; flex-wrap: wrap;
  -webkit-justify-content: center; justify-content: center;
  background:rgba(0,0,0,.3);
}
.dot { width:10px; height:10px; margin:0 5px; border-radius:50%; background:rgba(255,255,255,.2); -webkit-transition:all .3s; transition:all .3s; }
.dot.active { background:#f59e0b; -webkit-transform:scale(1.4); transform:scale(1.4); box-shadow:0 0 8px #f59e0b; }
.progress { height:4px; background:rgba(255,255,255,.1); -webkit-flex-shrink:0; flex-shrink:0; overflow:hidden; }
.progress-bar { height:100%; width:0%; background:linear-gradient(90deg, #f59e0b, #00ff88); }

/* ══ 右欄：外匯＋全球股市＋財經新聞 ══ */
.market-row { -webkit-flex:1; flex:1; min-height:0; display:-webkit-flex; display:flex; }
.market-col {
  width:50%; position:relative; min-height:0; overflow:hidden;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  border-right:1px solid rgba(245,158,11,.1);
}
.market-col:last-child { border-right:none; }
.col-header {
  -webkit-flex-shrink:0; flex-shrink:0;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  padding: 10px 20px;
  background: rgba(10,9,7,.6);
  border-bottom: 1px solid rgba(245,158,11,.12);
}
.col-header > * { margin-right:10px; }
.col-icon  { font-size:20px; }
.col-title { font-size:18px; font-weight:800; letter-spacing:3px; color:rgba(255,255,255,.6); }
.col-sub   { font-size:12px; letter-spacing:2px; color:rgba(255,255,255,.3); }
.col-widget { -webkit-flex:1; flex:1; min-height:0; position:relative; overflow:hidden; }
/* TradingView 元件字很小，整塊放大（zoom；transform 會讓跨網域 iframe 糊掉）。
   寬高由 JS 依外框算成「外框 ÷ 1.35」的固定像素，新舊版 zoom 算法下大小都一樣 */
.tv-zoom { position:absolute; top:0; left:0; zoom:1.35; }
.tradingview-widget-container,
.tradingview-widget-container__widget { width:100% !important; height:100% !important; }
/* 外匯清單：iframe 內無法捲動，改成兩份清單上下相接、整塊連續往上滾（只用 translate，不會糊）。
   每份高 575px＝7 列在 zoom 1.35 下全部放得下的高度，增減幣別要一起改（含 JS 的 FX_LIST_H） */
.fx-list-move { position:absolute; left:0; right:0; top:0; }
.fx-list-copy { position:relative; height:575px; overflow:hidden; }
@-webkit-keyframes fxLoop { from { -webkit-transform: translateY(0); } to { -webkit-transform: translateY(-575px); } }
@keyframes fxLoop { from { transform: translateY(0); } to { transform: translateY(-575px); } }

/* 外匯 K 線輪播 */
.fx-chart {
  -webkit-flex-shrink:0; flex-shrink:0; height:44%;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  border-bottom:1px solid rgba(245,158,11,.12);
}
.fx-chart-bar {
  -webkit-flex-shrink:0; flex-shrink:0; padding:8px 20px 4px;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
}
.fx-chart-name { font-size:22px; font-weight:900; color:#f59e0b; letter-spacing:1px; margin-right:10px; }
.fx-chart-sub  { font-size:13px; color:rgba(255,255,255,.4); letter-spacing:2px; }
.fx-dots { margin-left:auto; display:-webkit-flex; display:flex; }
.fx-dot { width:8px; height:8px; margin-left:7px; border-radius:50%; background:rgba(255,255,255,.2); -webkit-transition:all .3s; transition:all .3s; }
.fx-dot.active { background:#f59e0b; -webkit-transform:scale(1.3); transform:scale(1.3); box-shadow:0 0 6px #f59e0b; }
.fx-panes { -webkit-flex:1; flex:1; min-height:0; position:relative; }
/* 全部預先載入、用 visibility 切換：不會每 30 秒重載空白一下；display:none 會讓元件以 0 尺寸初始化 */
.fx-pane { position:absolute; top:0; left:0; right:0; bottom:0; visibility:hidden; opacity:0; -webkit-transition:opacity .6s; transition:opacity .6s; }
.fx-pane.active { visibility:visible; opacity:1; }
.fx-progress { -webkit-flex-shrink:0; flex-shrink:0; height:3px; background:rgba(255,255,255,.08); }
.fx-progress-bar { height:100%; width:0%; background:#f59e0b; }

/* 財經新聞跑馬燈 */
.news-bar {
  -webkit-flex-shrink:0; flex-shrink:0; height:84px; position:relative; overflow:hidden;
  background: linear-gradient(90deg,#04111f,#072340,#04111f);
  border-top: 3px solid #f59e0b;
}
.ticker-wrap {
  position:absolute; top:0; left:0; right:0; bottom:0; overflow:hidden;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
}
.ticker-wrap:before, .ticker-wrap:after { content:''; position:absolute; top:0; bottom:0; width:60px; z-index:2; pointer-events:none; }
.ticker-wrap:before { left:0;  background:linear-gradient(90deg,#04111f,rgba(4,17,31,0)); }
.ticker-wrap:after  { right:0; background:linear-gradient(270deg,#04111f,rgba(4,17,31,0)); }
.ticker-track {
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  white-space:nowrap;
}
@-webkit-keyframes tickerScroll { 0%{-webkit-transform:translateX(0)} 100%{-webkit-transform:translateX(-50%)} }
@keyframes tickerScroll { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
.ticker-item { font-size:38px; font-weight:700; color:rgba(255,255,255,.92); padding:0 18px; -webkit-flex-shrink:0; flex-shrink:0; }
.ticker-sep  { font-size:24px; color:#f59e0b; opacity:.6; padding:0 10px; -webkit-flex-shrink:0; flex-shrink:0; }
.ticker-tag  {
  -webkit-flex-shrink:0; flex-shrink:0; margin:0 10px 0 40px;
  padding:4px 14px; border-radius:8px;
  font-size:22px; font-weight:900; letter-spacing:1px; border:1px solid;
}
.tag-fin   { color:#10b981; border-color:rgba(16,185,129,.4); background:rgba(16,185,129,.12); }
.tag-stock { color:#a855f7; border-color:rgba(168,85,247,.45); background:rgba(168,85,247,.14); }
.ticker-loading { font-size:24px; color:rgba(255,255,255,.3); letter-spacing:4px; padding:0 30px; }
</style>
<script src="../../shared/kioskGuard.js"></script>
</head>
<body>

<!-- ══ 左 1/3：直立公告 ══ -->
<div class="col col-ann">
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

      <div class="fill" id="slides"></div>
    </div>

</div>

<!-- ══ 右 2/3：財經資訊 ══ -->
<div class="col col-main">
  <div class="header">
    <div class="header-left">
      <div class="header-icon">📈</div>
      <div>
        <div class="header-title">財經資訊</div>
        <div class="header-subtitle">FX · GLOBAL MARKETS</div>
      </div>
    </div>
    <div class="header-right">
      <div class="mkt-badge"><div class="badge-dot" id="dotTW"></div><span id="txtTW">台股</span></div>

      <div class="clock" id="clock">--:--:--</div>
    </div>

  <div class="market-row">
    <!-- 外匯：各幣別對台幣 -->

      <div class="fx-chart">

<script src="../../shared/api.js"></script>
<script>
'use strict';

/* ── 共用小工具（ES5） ── */
function $(id) { return document.getElementById(id); }
function each(list, fn) { Array.prototype.forEach.call(list, fn); }
function pad2(v) { return (v < 10 ? '0' : '') + v; }
function setAnim(el, value) { el.style.webkitAnimation = value; el.style.animation = value; }
function setTransform(el, value) { el.style.webkitTransform = value; el.style.transform = value; }
function setTransition(el, value) { el.style.webkitTransition = value; el.style.transition = value; }
function raf(fn) { (window.requestAnimationFrame || function (f) { return setTimeout(f, 16); })(fn); }
function esc(s) {
  return String(s || '').replace(/[&<>"]/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}
function getJSON(url, timeoutMs, ok, fail) {
  var xhr = new XMLHttpRequest();
  var done = false;
  function finish(err, data) { if (done) return; done = true; if (err) fail(err); else ok(data); }
  xhr.open('GET', url, true);
  xhr.timeout = timeoutMs;
  xhr.onload = function () {
    if (xhr.status < 200 || xhr.status >= 300) return finish('HTTP ' + xhr.status);
    try { finish(null, JSON.parse(xhr.responseText)); } catch (e) { finish(e); }
  };
  xhr.onerror = function () { finish('network'); };
  xhr.ontimeout = function () { finish('timeout'); };
  xhr.send();
}

/* ── TradingView 嵌入 ── */
var TV_ZOOM = 1.35;
function addTvWidget(host, widget, config, zoom) {
  var box = document.createElement('div');
  if (zoom) box.className = 'tv-zoom';
  else box.className = 'fill';
  box.innerHTML = '<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div>';
  var sc = document.createElement('script');
  sc.src = 'https://s3.tradingview.com/external-embedding/embed-widget-' + widget + '.js';
  sc.async = true;
  sc.text = JSON.stringify(config);
  box.firstChild.appendChild(sc);
  host.appendChild(box);
  return box;
}

/* ══════════ 縮放：一律由 JS 給固定像素 ══════════ */
var STAGE_DESIGN_W = 1600;   /* 公告舞台設計寬度（screen13 單位） */
function fitAll() {
  /* 公告舞台：transform scale，寬高 = 欄位 ÷ 倍率 */
  var wrap = $('annWrap'), stage = $('annStage');
  var s = wrap.clientWidth / STAGE_DESIGN_W;
  if (s > 0) {
    stage.style.width  = STAGE_DESIGN_W + 'px';
    stage.style.height = Math.ceil(wrap.clientHeight / s) + 'px';
    setTransform(stage, 'scale(' + s.toFixed(4) + ')');
  }
  /* TradingView 放大框：寬高 = 外框 ÷ 1.35 的像素，新舊版 zoom 算法下實際大小都等於外框 */
  each(document.querySelectorAll('.tv-zoom'), function (el) {
    var p = el.parentNode;
    el.style.width  = Math.floor(p.clientWidth  / TV_ZOOM) + 'px';
    el.style.height = Math.floor(p.clientHeight / TV_ZOOM) + 'px';
  });
  fitFxList();
}

/* ══════════ 左欄：直立公告（邏輯同 screen13，資料 announcements_v） ══════════ */
var TYPE_LABEL = { general:'一般公告', urgent:'緊急通知', event:'活動公告', notice:'重要通知' };

var data = { marquee:'', list:[] };
var current = 0, timer = null, schedTimer = null;
var activeList = [];
var lastSig = null;
var cloudState = 'idle';   /* 本機沒資料時改讀雲端：idle／loading／failed */

function getDuration(idx) {
  var a = activeList[idx];
  var sec = a && parseInt(a.duration, 10) > 0 ? parseInt(a.duration, 10) : 7;
  return Math.max(3, sec) * 1000;
}

function startProgress(ms) {
  var bar = $('progressBar');
  setTransition(bar, 'none'); bar.style.width = '0%';
  raf(function () { raf(function () {
    setTransition(bar, 'width ' + ms + 'ms linear');
    bar.style.width = '100%';
  }); });
}

function rocToWestern(d){ var p=d.split('-'),y=+p[0]; return (y<1900?y+1911:y)+'-'+p[1]+'-'+p[2]; }
function isAnnActive(a) {
  if (a.alwaysValid !== false && !a.startDate) return true;
  if (a.alwaysValid) return true;
  var now = new Date().getTime();
  var start = a.startDate ? new Date(rocToWestern(a.startDate) + 'T' + (a.startTime || '00:00')).getTime() : 0;
  var end   = a.endDate   ? new Date(rocToWestern(a.endDate)   + 'T' + (a.endTime   || '23:59:59')).getTime() : Infinity;
  return now >= start && now <= end;
}

function render() {
  var active = ((data && data.list) || []).filter(isAnnActive);
  var slidesEl = $('slides');
  var dotsEl   = $('dots');

  // 內容完全相同就不重建 DOM、不重置輪播位置（空清單時連同雲端讀取狀態一起比）
  var sig = JSON.stringify(active) + (active.length ? '' : cloudState);
  if (sig === lastSig) return;
  lastSig = sig;

  if (!active.length) {
    var msg = cloudState === 'loading' ? '公告載入中…'
            : cloudState === 'failed'  ? '公告載入中…<br><span style="font-size:60px">（等待網路連線）</span>'
            : '暫無公告';
    slidesEl.innerHTML = '<div class="ann-empty">' + msg + '</div>';
    dotsEl.innerHTML = '';
    activeList = [];
    if (timer) clearTimeout(timer);
    return;
  }

  activeList = active;

  slidesEl.innerHTML = active.map(function (a, i) {
    var type    = a.type || 'general';
    var hasImg  = !!a.imageUrl;
    var hasText = !!(a.title || a.content);

    var textBlock =
      '<div class="slide-badge badge-' + type + '">' + (TYPE_LABEL[type] || '公告') + '</div>' +
      '<div class="slide-title">' + esc(a.title) + '</div>' +
      '<div class="slide-body">' + (a.content || '') + '</div>' +
      '<div class="slide-date">' + (a.date || '') + '</div>';

    var inner;
    if (hasImg && !hasText) {
      inner = '<div class="slide-fullimg"><img src="' + esc(a.imageUrl) + '" alt="公告圖片" onerror="this.style.display=\'none\'"></div>';
    } else if (hasImg) {
      inner = '<div class="slide-inner slide-with-img">' +
                '<div class="slide-img-top"><img src="' + esc(a.imageUrl) + '" alt="公告圖片" onerror="this.parentNode.style.display=\'none\'"></div>' +
                '<div class="slide-text-block">' + textBlock + '</div>' +
              '</div>';
    } else {
      inner = '<div class="slide-inner">' + textBlock + '</div>';
    }
    return '<div class="slide' + (i === 0 ? ' active' : '') + '" data-i="' + i + '">' + inner + '</div>';
  }).join('');

  dotsEl.innerHTML = active.map(function (_, i) {
    return '<div class="dot' + (i === 0 ? ' active' : '') + '"></div>';
  }).join('');

  current = 0;
  startSlider();
}

function goTo(idx) {
  var slides = document.querySelectorAll('.slide');
  var dots   = document.querySelectorAll('.dot');
  if (!slides.length) return;

  slides[current].classList.remove('active');
  dots[current].classList.remove('active');

  current = ((idx % slides.length) + slides.length) % slides.length;

  var newSlide = slides[current];
  newSlide.classList.add('active');
  newSlide.classList.add('slide-in');
  dots[current].classList.add('active');
  setTimeout(function () { newSlide.classList.remove('slide-in'); }, 1200);

  var dur = getDuration(current);
  startProgress(dur);
  scheduleNext(dur);
}

function scheduleNext(dur) {
  if (timer) clearTimeout(timer);
  if (activeList.length <= 1) return;
  timer = setTimeout(function () { goTo(current + 1); }, dur);
}

function startSlider() {
  if (timer) clearTimeout(timer);
  var slides = document.querySelectorAll('.slide');
  if (slides[0]) {
    slides[0].classList.add('slide-in');
    setTimeout(function () { slides[0].classList.remove('slide-in'); }, 1200);
  }
  var dur = getDuration(0);
  startProgress(dur);
  scheduleNext(dur);
}

/* 本機 localStorage 沒有公告（播放器清空／不能存資料）時，直接讀 GitHub 上的 backup.json */
function loadFromCloud() {
  if (cloudState === 'loading' || !window.ghBackup) return;
  cloudState = 'loading';
  render();
  window.ghBackup.load().then(function (b) {
    var av = b && b.announcements_v;
    if (av && av.list && av.list.length) {
      cloudState = 'idle';
      data = av;
      try { localStorage.setItem('bbs_announcements_v', JSON.stringify(av)); } catch (e) { /* 存不了也照樣顯示 */ }
    } else {
      cloudState = b ? 'idle' : 'failed';   /* 讀得到但真的沒公告＝暫無公告；讀不到＝等網路 */
    }
    render();
  }, function () { cloudState = 'failed'; render(); });
}

/* ══════════ 右欄：時鐘與開收盤 ══════════ */
var WEEK = ['日','一','二','三','四','五','六'];
function tick() {
  var n = new Date();
  $('clock').textContent = pad2(n.getHours()) + ':' + pad2(n.getMinutes()) + ':' + pad2(n.getSeconds());
  $('date').textContent = pad2(n.getMonth() + 1) + '/' + pad2(n.getDate()) + '（' + WEEK[n.getDay()] + '）';

  var day = n.getDay(), mins = n.getHours() * 60 + n.getMinutes();
  var weekday = day >= 1 && day <= 5;
  var twOpen = weekday && mins >= 540 && mins < 810;              // 09:00–13:30
  // 美股（台灣時間）夏令 21:30–04:00、冬令 22:30–05:00，取聯集；週一凌晨是週五的盤要排除、週六凌晨要算
  var usOpen = (weekday && mins >= 1290) || (day >= 2 && day <= 6 && mins < 300);
  $('dotTW').className = 'badge-dot' + (twOpen ? '' : ' closed');
  $('txtTW').textContent = '台股 ' + (twOpen ? '盤中' : '收盤');
  $('dotUS').className = 'badge-dot' + (usOpen ? '' : ' closed');
  $('txtUS').textContent = '美股 ' + (usOpen ? '盤中' : '收盤');
}

/* ══════════ 右欄：外匯 K 線輪播 ══════════ */
/* K 線輪播與下方報價清單共用；d＝K 線標題，n＝清單名稱。增減幣別要一起調整 FX_LIST_H */
var FX_LIST = [
  { s:'FX_IDC:USDTWD', d:'美元 / 台幣',   n:'美元 USD' },
  { s:'FX_IDC:JPYTWD', d:'日圓 / 台幣',   n:'日圓 JPY' },
  { s:'FX_IDC:EURTWD', d:'歐元 / 台幣',   n:'歐元 EUR' },
  { s:'FX_IDC:CNYTWD', d:'人民幣 / 台幣', n:'人民幣 CNY' },
  { s:'FX_IDC:HKDTWD', d:'港幣 / 台幣',   n:'港幣 HKD' },
  { s:'FX_IDC:GBPTWD', d:'英鎊 / 台幣',   n:'英鎊 GBP' },
  { s:'FX_IDC:AUDTWD', d:'澳幣 / 台幣',   n:'澳幣 AUD' }
];
var FX_INTERVAL = 30 * 1000;
var fxIdx = 0;

function buildFxPanes() {
  var panes = $('fxPanes');
  FX_LIST.forEach(function (fx, i) {
    var pane = document.createElement('div');
    pane.className = 'fx-pane' + (i === 0 ? ' active' : '');
    panes.appendChild(pane);
    addTvWidget(pane, 'symbol-overview', {
      symbols: [[fx.d, fx.s + '|3M']],
      chartOnly: true,
      width: '100%', height: '100%',
      locale: 'zh_TW', colorTheme: 'dark', isTransparent: true,
      autosize: true, showVolume: false, showMA: false,
      hideDateRanges: true, hideMarketStatus: true, hideSymbolLogo: true,
      scalePosition: 'right', scaleMode: 'Normal',
      fontSize: '12', noTimeScale: false, valuesTracking: '1',
      changeMode: 'price-and-percent',
      chartType: 'candlesticks',
      /* 台灣習慣：紅漲綠跌 */
      upColor: '#ef4444', downColor: '#22c55e',
      borderUpColor: '#ef4444', borderDownColor: '#22c55e',
      wickUpColor: '#ef4444', wickDownColor: '#22c55e',
      gridLineColor: 'rgba(255,255,255,0.05)',
      dateRanges: ['3m|1D']
    }, false);
  });
  $('fxDots').innerHTML = FX_LIST.map(function (_, i) {
    return '<div class="fx-dot' + (i === 0 ? ' active' : '') + '"></div>';
  }).join('');
  showFx(0);
}

function showFx(idx) {
  fxIdx = idx % FX_LIST.length;
  each(document.querySelectorAll('.fx-pane'), function (p, i) { p.classList.toggle('active', i === fxIdx); });
  each(document.querySelectorAll('.fx-dot'),  function (d, i) { d.classList.toggle('active', i === fxIdx); });
  $('fxName').textContent = FX_LIST[fxIdx].d;
  var bar = $('fxProgress');
  setTransition(bar, 'none'); bar.style.width = '0%';
  raf(function () { raf(function () {
    setTransition(bar, 'width ' + FX_INTERVAL + 'ms linear');
    bar.style.width = '100%';
  }); });
}

/* 報價清單：兩份相同的 market-overview 上下相接，連續往上滾，接縫看不出來 */
var FX_LIST_H = 575;
var FX_SCROLL_PX_PER_S = 25;
function buildFxList() {
  var move = $('fxListMove');
  var config = {
    colorTheme: 'dark', dateRange: '1D', showChart: false,
    locale: 'zh_TW', isTransparent: true, showSymbolLogo: true, showFloatingTooltip: false,
    width: '100%', height: '100%',
    tabs: [{ title: '對台幣', symbols: FX_LIST.map(function (fx) { return { s: fx.s, d: fx.n }; }) }]
  };
  for (var i = 0; i < 2; i++) {
    var copy = document.createElement('div');
    copy.className = 'fx-list-copy';
    move.appendChild(copy);
    addTvWidget(copy, 'market-overview', config, true);
  }
}

/* 放得下整份清單就不滾、藏起第二份；放不下才循環滾動。視窗大小改變時重算 */
var fxLooping = null;
function fitFxList() {
  var wrap = $('fxListWrap'), move = $('fxListMove');
  if (!move.children[1]) return;
  var loop = wrap.clientHeight < FX_LIST_H - 2;
  if (loop === fxLooping) return;
  fxLooping = loop;
  move.children[1].style.visibility = loop ? 'visible' : 'hidden';
  setAnim(move, loop ? 'fxLoop ' + (FX_LIST_H / FX_SCROLL_PX_PER_S).toFixed(1) + 's linear infinite' : 'none');
}

/* ══════════ 右欄：全球股市 ══════════ */
function buildStocks() {
  addTvWidget($('stockWrap'), 'market-overview', {
    colorTheme: 'dark', dateRange: '1D', showChart: false,
    locale: 'zh_TW', isTransparent: true, showSymbolLogo: true, showFloatingTooltip: false,
    width: '100%', height: '100%',
    tabs: [{
      title: '全球指數',
      symbols: [
        { s: 'INDEX:TWII',       d: '台灣加權指數' },
        { s: 'INDEX:NKY',        d: '日經 225' },
        { s: 'INDEX:HSI',        d: '恆生指數' },
        { s: 'SSE:000001',       d: '上證綜指' },
        { s: 'FOREXCOM:SPXUSD',  d: 'S&P 500' },
        { s: 'FOREXCOM:NSXUSD',  d: 'NASDAQ 100' },
        { s: 'PEPPERSTONE:US30', d: '道瓊工業' },
        { s: 'NASDAQ:SOXX',      d: '費城半導體 SOXX' },
        { s: 'INDEX:DAX',        d: '德國 DAX' },
        { s: 'FOREXCOM:UKXGBP',  d: '英國 FTSE 100' }
      ]
    }]
  }, true);
}

/* ══════════ 右欄：財經新聞跑馬燈 ══════════ */
/* 自架新聞轉接（office 主機 bbs-news-proxy），與 screen7 共用；rows[1]=台灣財經、rows[4]=股市即時。
   改來源要同步 screen7 的 FEEDS 與 office 的 feeds.json。 */
var NEWS_API  = 'https://news.shoyubook.com/rows';
var NEWS_ROWS = [ { i:1, tag:'台灣財經', cls:'tag-fin' }, { i:4, tag:'股市即時', cls:'tag-stock' } ];
var NEWS_REFETCH = 5 * 60 * 1000;
var PX_PER_S = 70;
var MAX_PER_ROW = 15;   /* 每組最多幾則，避免一輪跑太久 */
var lastNewsSig = null, newsRetry = null;

function fetchNews() {
  clearTimeout(newsRetry);
  getJSON(NEWS_API + '?t=' + Date.now(), 10000, function (json) {
    var groups = NEWS_ROWS.map(function (r) {
      var row = json.rows && json.rows[r.i];
      return { tag: r.tag, cls: r.cls, titles: ((row && row.titles) || []).slice(0, MAX_PER_ROW) };
    }).filter(function (g) { return g.titles.length; });
    if (!groups.length) { newsRetry = setTimeout(fetchNews, 60000); return; }
    var sig = JSON.stringify(groups);
    if (sig !== lastNewsSig) { lastNewsSig = sig; renderTicker(groups); }   /* 內容沒變不重畫，跑馬燈不會從頭開始 */
  }, function () {
    /* 失敗保留現有內容，1 分鐘後重試 */
    newsRetry = setTimeout(fetchNews, 60000);
  });
}

function renderTicker(groups) {
  var track = $('ticker');
  setAnim(track, 'none');
  setTransform(track, 'translateX(0)');

  var html = '';
  groups.forEach(function (g) {
    html += '<span class="ticker-tag ' + g.cls + '">' + esc(g.tag) + '</span>';
    g.titles.forEach(function (t) {
      html += '<span class="ticker-item">' + esc(t) + '</span><span class="ticker-sep">◆</span>';
    });
  });
  /* 內容×2 無縫銜接 */
  track.innerHTML = html + html;
  setTransform(track, '');

  raf(function () { raf(function () {
    var halfW = track.scrollWidth / 2;
    if (halfW < 10) return;
    setAnim(track, 'tickerScroll ' + (halfW / PX_PER_S).toFixed(2) + 's linear infinite');
  }); });
}

/* ══════════ 初始化 ══════════ */
function init() {
  var restore;
  /* 播放器若完全禁止 localStorage，autoRestore 可能直接丟例外；吞掉後照樣走雲端備援 */
  try { restore = window.ghBackup ? window.ghBackup.autoRestore() : Promise.resolve(); }
  catch (e) { restore = Promise.resolve(); }
  restore.then(null, function () {}).then(function () {
    return window.api.get('announcements_v');
  }).then(function (d) {
    data = d || { marquee:'', list:[] };
    if (!data.list || !data.list.length) loadFromCloud();
    render();
  }, function () { loadFromCloud(); });

  /* 每分鐘依起訖時間上下架；本機一直沒有公告時順便再試一次雲端 */
  schedTimer = setInterval(function () {
    if (!data || !data.list || !data.list.length) loadFromCloud();
    render();
  }, 60000);
}

window.api.on('announcements_v:updated', function (d) { data = d; render(); });

buildFxPanes();
buildFxList();
buildStocks();
fitAll();
window.addEventListener('resize', fitAll);
tick();
var clockTimer = setInterval(tick, 1000);
fetchNews();
var newsTimer = setInterval(fetchNews, NEWS_REFETCH);
var fxTimer = setInterval(function () { showFx(fxIdx + 1); }, FX_INTERVAL);

window.addEventListener('beforeunload', function () {
  if (timer)      clearTimeout(timer);
  if (schedTimer) clearInterval(schedTimer);
  clearInterval(clockTimer);
  clearInterval(newsTimer);
  clearInterval(fxTimer);
});

init();
</script>
