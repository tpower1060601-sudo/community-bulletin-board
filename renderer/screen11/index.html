<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="1800">
<title>樓層告示牌 螢幕二 15F–28F</title>
<style>
*{margin:0;padding:0;-webkit-box-sizing:border-box;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#050505;font-family:'Microsoft JhengHei','PingFang TC','Hiragino Sans TC','Noto Sans TC',sans-serif;-webkit-transform-origin:0 0;transform-origin:0 0}
#bd{position:absolute;top:18px;left:18px;right:18px;bottom:18px;display:-webkit-box;display:-ms-flexbox;display:flex;-webkit-box-orient:vertical;-webkit-box-direction:normal;-ms-flex-direction:column;flex-direction:column;border:1px solid #1c1005;border-radius:6px;padding:5px}
.sl{position:relative;-webkit-box-flex:1;-ms-flex:1 1 auto;flex:1;margin-bottom:3px}
.sl:last-child{margin-bottom:0}
.bg,.bc{position:absolute;top:0;left:0;right:0;bottom:0;display:-webkit-box;display:-ms-flexbox;display:flex;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;padding:0 20px;background:#101010}
.bg{z-index:1}.bc{z-index:2}
.th,.bf{position:absolute;left:0;right:0;height:50%;overflow:hidden}
.th{top:0;z-index:3;-webkit-transform-origin:50% 100%;transform-origin:50% 100%}
.bf{bottom:0;z-index:4;-webkit-transform-origin:50% 0%;transform-origin:50% 0%}
.th .in,.bf .in{position:absolute;left:0;right:0;height:200%;display:-webkit-box;display:-ms-flexbox;display:flex;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;padding:0 20px;background:#101010}
.th .in{top:0}.bf .in{bottom:0}
.dv{position:absolute;left:0;right:0;top:50%;height:2px;background:#050505;z-index:10}
.fl{-ms-flex-negative:0;flex-shrink:0;width:180px;text-align:center;font-size:76px;font-weight:900;color:#c87010;letter-spacing:2px}
.co{-webkit-box-flex:1;-ms-flex:1 1 auto;flex:1;font-size:68px;font-weight:400;color:#d4b050;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:1px}
.grp-top{border-top:5px solid #d4a030;border-left:5px solid #d4a030;border-right:5px solid #d4a030;border-radius:10px 10px 0 0;margin-bottom:0}
.grp-mid{border-left:5px solid #d4a030;border-right:5px solid #d4a030;margin-bottom:0}
.grp-bot{border-bottom:5px solid #d4a030;border-left:5px solid #d4a030;border-right:5px solid #d4a030;border-radius:0 0 10px 10px}
</style>
</head>
<body>
<div id="bd"></div>
<script src="../../shared/api.js"></script>
<script src="../../shared/floorData.js"></script>
<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  ★ 資料來源：管理後台「水牌管理」★                          ║
// ║  請至管理後台修改，不要直接改這個檔案。                       ║
// ║  預設值與後備資料放在 shared/floorData.js。                   ║
// ║  本畫面顯示 15 樓以上 的樓層。                                ║
// ╚══════════════════════════════════════════════════════════════╝

var PAGE_MS = 10000;  // 每頁停留毫秒（10000 = 10 秒）
var STAGGER  = 180;   // 每列翻牌間隔毫秒
// ──────────────────────────────────────────────────────
// 系統程式碼，請勿修改以下內容
// ──────────────────────────────────────────────────────
var PG=12,bd=document.getElementById('bd'),pgs=[],sl=[],DATA=[],cur=0;
/* 重新載入資料時要能中止舊的翻牌排程，否則會有兩組動畫同時跑 */
var _tm=[];
function T(fn,ms){var id=setTimeout(fn,ms);_tm.push(id);return id;}
function clearT(){_tm.forEach(clearTimeout);_tm=[];}
function buildSlots(){
  bd.innerHTML='';sl=[];
  for(var i=0;i<PG;i++){
    var e=document.createElement('div');e.className='sl';
    e.innerHTML='<div class="bg"><div class="fl"></div><div class="co"></div></div>'
      +'<div class="bc"><div class="fl"></div><div class="co"></div></div>'
      +'<div class="th"><div class="in"><div class="fl"></div><div class="co"></div></div></div>'
      +'<div class="bf" style="transform:perspective(900px) rotateX(-90deg)"><div class="in"><div class="fl"></div><div class="co"></div></div></div>'
      +'<div class="dv"></div>';
    bd.appendChild(e);
    sl.push({bg:e.querySelector('.bg'),bc:e.querySelector('.bc'),
      th:e.querySelector('.th'),thi:e.querySelector('.th .in'),
      bf:e.querySelector('.bf'),bfi:e.querySelector('.bf .in')});
  }
}
function sc(el,f,c){el.querySelector('.fl').textContent=f||'';var co=el.querySelector('.co');co.textContent=c||'';co.style.fontSize='';if(c){var base=68;co.style.fontSize=base+'px';if(co.scrollWidth>co.clientWidth){co.style.fontSize=Math.max(Math.floor(base*co.clientWidth/co.scrollWidth),36)+'px';}}el.style.opacity=(f||c)?'1':'0.06';}
function applyGroups(pi){var pg=pgs[pi];for(var i=0;i<PG;i++){var e=sl[i].bg.parentNode;e.className='sl';var g=pg[i]&&pg[i].group;if(!g)continue;var prev=i>0&&pg[i-1]&&pg[i-1].group===g;var next=i<PG-1&&pg[i+1]&&pg[i+1].group===g;if(!prev&&next)e.className='sl grp-top';else if(prev&&next)e.className='sl grp-mid';else if(prev&&!next)e.className='sl grp-bot';}}
function initSlots(pi){pgs[pi].forEach(function(d,i){var s=sl[i];sc(s.bg,d.floor,d.company);sc(s.bc,d.floor,d.company);sc(s.thi,d.floor,d.company);sc(s.bfi,d.floor,d.company);s.th.style.transition='none';s.th.style.transform='';s.bf.style.transition='none';s.bf.style.transform='perspective(900px) rotateX(-90deg)';});applyGroups(pi);}
function flipRow(s,f,c,done){sc(s.bg,f,c);sc(s.bfi,f,c);s.bf.style.transition='none';s.bf.style.transform='perspective(900px) rotateX(-90deg)';requestAnimationFrame(function(){s.th.style.transition='transform 0.28s ease-in';s.th.style.transform='perspective(900px) rotateX(-90deg)';T(function(){s.bf.style.transition='transform 0.28s ease-out';s.bf.style.transform='perspective(900px) rotateX(0deg)';T(function(){sc(s.bc,f,c);sc(s.thi,f,c);s.th.style.transition='none';s.th.style.transform='';s.bf.style.transition='none';s.bf.style.transform='perspective(900px) rotateX(-90deg)';if(done)done();},360);},200);});}
function run(){if(pgs.length<=1)return;var nxt=(cur+1)%pgs.length;T(function(){for(var i=0;i<PG;i++){(function(idx){var d=pgs[nxt][idx];T(function(){flipRow(sl[idx],d.floor,d.company,idx===PG-1?function(){cur=nxt;applyGroups(cur);run();}:null);},idx*STAGGER);})(i);}},PAGE_MS);}
function start(rows){
  clearT();
  DATA=rows.filter(function(d){return d.company;});
  pgs=[];
  for(var j=0;j<DATA.length;j+=PG)pgs.push(DATA.slice(j,j+PG));
  if(!pgs.length)pgs.push([]);
  while(pgs[pgs.length-1].length<PG)pgs[pgs.length-1].push({floor:'',company:''});
  buildSlots();cur=0;initSlots(0);run();
}
/* 只取屬於這塊水牌的樓層 */
function pick(all){return (all||[]).filter(function(f){var n=window.FloorData.floorNum(f.floor);return n >= 15;});}
function apply(saved){var all=(saved&&saved.length)?saved:window.FloorData.DEFAULT_FLOORS;start(pick(all));}
function load(){return window.api.get('floors').then(apply);}
if(window.ghBackup&&window.ghBackup.autoRestore)window.ghBackup.autoRestore().then(load,load);else load();
/* 後台儲存後（或 GitHub 輪詢抓到新版本）自動套用，不必重開瀏覽器 */
window.api.on('floors:updated',apply);
(function autoScale(){var W=1080,H=1920;function fit(){var s=Math.min(window.innerWidth/W,window.innerHeight/H);document.body.style.transform='scale('+s+')';document.documentElement.style.width=W+'px';document.documentElement.style.height=H+'px';}fit();window.addEventListener('resize',fit);})();
</script>
</body>
</html>
